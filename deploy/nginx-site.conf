# 放在 /etc/nginx/sites-enabled/ 下时，本文件处于 http 上下文
limit_req_zone $binary_remote_addr zone=plt_convert:10m rate=2r/s;
limit_conn_zone $binary_remote_addr zone=plt_conn:10m;

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    client_max_body_size 25m;
    client_body_timeout 60s;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Robots-Tag "noindex, nofollow" always;

    location = /api/convert {
        limit_req zone=plt_convert burst=5 nodelay;
        limit_req_status 429;
        limit_conn plt_conn 2;
        limit_conn_status 429;

        proxy_pass http://127.0.0.1:8000;
        include /etc/nginx/proxy_params;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    location / {
        proxy_pass http://127.0.0.1:8000;
        include /etc/nginx/proxy_params;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }
}
